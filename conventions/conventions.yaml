  - cp.was_endpoint_accessed_with_header
  - cp.was_endpoint_accessed_with_header_value
  - cp.was_endpoint_accessed_with_method
  - cp.was_endpoint_accessed_with_methods
  - cp.was_endpoint_accessed_with_prefix
