spec_version: 0.3.0
prefix: sbob
legacy_prefixes:
  - kubescape.io
  - signature.kubescape.io
api_groups:
  current:
    - profiles.sbob
    - rules.sbob
  legacy:
    - spdx.softwarecomposition.kubescape.io
    - kubescape.io
kinds:
  - kind: RuntimeProfile
    group: profiles.sbob
    version: v1beta1
    resource: runtimeprofiles
    subject_values: [container, host]
    legacy_kind: ContainerProfile
    legacy_group: spdx.softwarecomposition.kubescape.io
    legacy_version: v1beta1
    legacy_resource: containerprofiles
  - kind: CollapseConfiguration
    group: profiles.sbob
    legacy_group: spdx.softwarecomposition.kubescape.io
  - kind: SeccompProfile
    group: profiles.sbob
    legacy_group: spdx.softwarecomposition.kubescape.io
  - kind: Rules
    group: rules.sbob
    legacy_group: kubescape.io
    legacy_version: v1
    legacy_resource: rules
  - kind: RuntimeRuleAlertBinding
    group: rules.sbob
    legacy_group: kubescape.io
    legacy_version: v1
    legacy_resource: runtimerulealertbindings
status_values: [initializing, ready, completed, failed, too-large, incomplete, missing-runtime]
completion_values: [partial, complete]
labels:
  - key: sbob/user-defined-profile
    legacy: kubescape.io/user-defined-profile
    meaning: binding label on a Pod or Node naming the authored document
  - key: sbob/profile-role
    legacy: kubescape.io/profile-role
    values: [shadow, suggestion]
    meaning: role of a learned document or of a proposal computed from one
  - key: sbob/learning
    legacy: kubescape.io/learning
    meaning: legacy learning marker, inert for governance
  - key: sbob/instance-template-hash
    legacy: kubescape.io/instance-template-hash
    meaning: workload template hash the learned document was recorded for
  - key: sbob/host
    legacy: kubescape.io/host
    meaning: host document marker read by storage cleanup
  - key: sbob/subject-type
    legacy: kubescape.io/sbom-type
    values: [container, node]
    meaning: legacy identity of a host document, replaced by the subject field
  - key: sbob/profile-fragment
    legacy: kubescape.io/profile-fragment
    meaning: fragment marker on an authored container document
  - key: sbob/host-fragment
    legacy: kubescape.io/host-fragment
    meaning: fragment class marker on an authored host document
  - key: sbob/host-fragment-base
    legacy: kubescape.io/host-fragment-base
    meaning: reference to the base fragment of a host document
  - key: sbob/host-fingerprint
    legacy: kubescape.io/host-fingerprint
    meaning: first 32 hex digits of the SHA-256 of a learned host fragment's canonical fingerprint parts; absent on the custom fragment
  - key: sbob/bundle
    legacy: signature.kubescape.io/bundle
    meaning: bundle a signed fragment belongs to
  - key: sbob/fragment-class
    legacy: signature.kubescape.io/fragment-class
    values: [base, admission, overlay]
    meaning: class of a signed fragment
  - key: sbob/version
    legacy: signature.kubescape.io/version
    meaning: monotonic version of a signed fragment
  - key: sbob/generator
    legacy: signature.kubescape.io/generator
    meaning: tool that produced the document
  - key: sbob/generator-ref
    legacy: signature.kubescape.io/generator-ref
    meaning: revision of the tool that produced the document
  - key: sbob/matcher-version
    legacy: signature.kubescape.io/matcher-version
    meaning: grammar version the document was authored against
  - key: sbob/ignore
    legacy: kubescape.io/ignore
    meaning: namespace or workload excluded from tracing
  - key: sbob/tier
    legacy: kubescape.io/tier
    values: [core]
    meaning: namespace tier label of the operator's own namespace
  - key: sbob/infra
    legacy: kubescape.io/infra
    meaning: infrastructure namespace marker
  - key: sbob/namespace
    legacy: kubescape.io/namespace
    meaning: namespace marker written by the chart
  - key: sbob/node-group
    legacy: kubescape.io/node-group
    meaning: node group a host document template applies to
  - key: sbob/canary
    legacy: kubescape.io/canary
    meaning: canary workload marker of the standing live check
  - key: sbob/user-defined-network
    legacy: kubescape.io/user-defined-network
    meaning: legacy binding label of a network document, retired with the merged document
  - key: sbob/suggested-from
    legacy: kubescape.io/suggested-from
    meaning: learned document a proposal was computed from
  - key: sbob/delta-of
    legacy: kubescape.io/delta-of
    meaning: authored document or bundle a proposed fragment adds to
  - key: sbob/peer-namespace
    legacy: kubescape.io/peer-namespace
    meaning: namespace of the client workload a proposed ingress fragment admits
  - key: sbob/peer-workload
    legacy: kubescape.io/peer-workload
    meaning: client workload a proposed ingress fragment admits
  - key: sbob/suggest-bundle
    legacy: kubescape.io/suggest-bundle
    meaning: bundle a pod asks its proposals to be made for; read from the pod as a label, then as an annotation
annotations:
  - key: sbob/spec-version
    legacy: sbob.io/spec-version
    meaning: specification version the document conforms to
  - key: sbob/host-fingerprint-parts
    legacy: kubescape.io/host-fingerprint-parts
    meaning: compact JSON of the fields a learned host fragment was produced on (kernel - kernelRelease, kernelBuild, arch; packages - osID, osVersion, packageDB, arch; runtime - runtime, runtimeVersion, cni, cniVersion, arch)
  - key: sbob/status
    legacy: kubescape.io/status
    values_ref: status_values
    meaning: learning status of a learned document
  - key: sbob/completion
    legacy: kubescape.io/completion
    values_ref: completion_values
    meaning: completion of a learned document
  - key: sbob/managed-by
    legacy: kubescape.io/managed-by
    values: [User]
    meaning: an authored document; annotation only, exact value
  - key: sbob/workload-kind
    legacy: kubescape.io/workload-kind
  - key: sbob/workload-name
    legacy: kubescape.io/workload-name
  - key: sbob/workload-namespace
    legacy: kubescape.io/workload-namespace
  - key: sbob/workload-container-name
    legacy: kubescape.io/workload-container-name
  - key: sbob/workload-container-type
    legacy: kubescape.io/workload-container-type
  - key: sbob/workload-resource-version
    legacy: kubescape.io/workload-resource-version
  - key: sbob/instance-id
    legacy: kubescape.io/instance-id
  - key: sbob/wlid
    legacy: kubescape.io/wlid
    meaning: workload identifier string; replaced by the identity fields
  - key: sbob/image-id
    legacy: kubescape.io/image-id
  - key: sbob/image-tag
    legacy: kubescape.io/image-tag
  - key: sbob/image-name
    legacy: kubescape.io/image-name
  - key: sbob/report-timestamp
    legacy: kubescape.io/report-timestamp
  - key: sbob/previous-report-timestamp
    legacy: kubescape.io/previous-report-timestamp
  - key: sbob/report-series-id
    legacy: kubescape.io/report-series-id
  - key: sbob/resource-size
    legacy: kubescape.io/resource-size
  - key: sbob/sync-checksum
    legacy: kubescape.io/sync-checksum
  - key: sbob/deflate-checksum
    legacy: kubescape.io/deflate-checksum
  - key: sbob/tool-version
    legacy: kubescape.io/tool-version
  - key: sbob/max-sniffing-time
    legacy: kubescape.io/max-sniffing-time
  - key: sbob/persisted
    legacy: kubescape.io/persisted
  - key: sbob/residual-stamp
    legacy: kubescape.io/residual-stamp
  - key: sbob/last-update
    legacy: kubescape.io/last-update
  - key: sbob/last-checked
    legacy: kubescape.io/last-checked
  - key: sbob/otel-traceparent
    legacy: kubescape.io/otel-traceparent
  - key: sbob/otel-span-id
    legacy: kubescape.io/otel-span-id
  - key: sbob/bundle-manifest
    legacy: signature.kubescape.io/bundle-manifest
    meaning: the bundle manifest a signed fragment commits to
  - key: sbob/content
    legacy: signature.kubescape.io/content
    meaning: signed content of a fragment
  - key: sbob/signature
    legacy: signature.kubescape.io/signature
  - key: sbob/certificate
    legacy: signature.kubescape.io/certificate
  - key: sbob/identity
    legacy: signature.kubescape.io/identity
    meaning: signer identity of a signed fragment
  - key: sbob/issuer
    legacy: signature.kubescape.io/issuer
    meaning: issuer of the signer identity
  - key: sbob/timestamp
    legacy: signature.kubescape.io/timestamp
    meaning: signing time of a fragment
  - key: sbob/workload-api-group
    legacy: kubescape.io/workload-api-group
  - key: sbob/workload-api-version
    legacy: kubescape.io/workload-api-version
  - key: sbob/timeline
    legacy: kubescape.io/timeline
    meaning: governance transitions of the recorded container, written by the agent and kept by storage across updates
  - key: sbob/suggest-request
    legacy: kubescape.io/suggest-request
    meaning: request identifier a pod asks a proposal with, carried onto the proposal
  - key: sbob/suggest-kind
    legacy: kubescape.io/suggest-kind
    values: [full, delta]
    meaning: kind of proposal a pod asks for
  - key: sbob/suggestion-sha256
    legacy: kubescape.io/suggestion-sha256
    meaning: digest of the proposed content, compared before a proposal is rewritten
  - key: sbob/suggestion-source-rv
    legacy: kubescape.io/suggestion-source-rv
    meaning: resource version of the learned document a proposal was computed from
  - key: sbob/suggestion-version
    legacy: kubescape.io/suggestion-version
    meaning: counter raised each time the content of a proposal changes
  - key: sbob/created-by
    legacy: kubescape.io/created-by
    meaning: component that wrote a proposal
  - key: sbob/expires-at
    legacy: kubescape.io/expires-at
    meaning: time after which an unaccepted proposal is withdrawn, RFC 3339
  - key: sbob/evidence
    legacy: kubescape.io/evidence
    values: [client, shadow, both]
    meaning: where the traffic behind a proposed ingress fragment was seen, at the client, in the learned document of the target, or both
  - key: sbob/peer-self
    legacy: kubescape.io/peer-self
    meaning: the client of a proposed ingress fragment is the workload itself
  - key: sbob/delta-base-only
    legacy: kubescape.io/delta-base-only
    meaning: sections in which the learned document holds values the governing one lacks and that a proposed overlay fragment leaves to the base fragment, comma separated
  - key: sbob/rekor-bundle
    legacy: signature.kubescape.io/rekor-bundle
    meaning: transparency log bundle of a signed fragment
image_labels:
  - key: sbob.spec-version
    meaning: specification version the image implements; OCI label keys take dots, not slashes
  - key: sbob.library-version
    meaning: version of the reference library the image was built against
retired:
  - legacy: kubescape.io/context
    reason: software bill of materials, pending
  - legacy: kubescape.io/node-name
    reason: software bill of materials, pending
  - legacy: kubescape.io/scanner-memory-limit
    reason: software bill of materials, pending
  - legacy: kubescape.io/cloud-account-identifier
    reason: vendor backend
  - legacy: kubescape.io/region
    reason: vendor backend
  - legacy: kubescape.io/cluster
    reason: vendor backend
  - legacy: kubescape.io/host-id
    reason: vendor backend
  - legacy: kubescape.io/host-type
    reason: vendor backend
  - legacy: kubescape.io/artifact-type
    reason: vendor backend
# Chapter 8 (draft): keys of the `extensions` object and the values they draw from.
extensions:
  endpoint_keys:
    - key: protocol
      meaning: application protocol of the exchange; absent means http
    - key: peer
      meaning: identifier of a network entry of the same section level
    - key: requires
      meaning: session properties the exchange must have
    - key: data
      meaning: data classes intended in request and response, and classes expected in them
  network_keys:
    - key: tls
      meaning: transport security intended on connections with the peer
  protocols: [http, grpc, websocket, pgsql, mysql, redis, kafka, dns]
  requires_values:
    - value: tls
    - value: auth
    - value: cleartext
      only_in: subtract
  data_classes:
    pii: [pii.email, pii.phone, pii.name, pii.iban, pii.card, pii.national-id, pii.health, pii.address, pii.birth-date]
    secret: [secret.bearer, secret.jwt, secret.private-key, secret.cloud-key, secret.password, secret.token]
    marker: [marker.canary]
  peer_classes: [host, cluster, world, eu, eea]
  verdict_statuses: [compliant, violated, not-observed, inconclusive]
  inconclusive_reasons:
    - sensor-gap
    - result-truncated
    - payload-not-decrypted
    - protocol-not-decoded
    - payload-truncated
    - handshake-not-seen
    - peer-class-unknown
    - expected-class-not-seen
    - timeout
    - error
